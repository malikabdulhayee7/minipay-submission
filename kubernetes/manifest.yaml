apiVersion: v1
kind: Namespace
metadata:
  name: minipay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minipay-api
  namespace: minipay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minipay-api
  template:
    metadata:
      labels:
        app: minipay-api
    spec:
      containers:
        - name: api
          image: nginx:alpine
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "minipay-db"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: minipay-api
  namespace: minipay
spec:
  selector:
    app: minipay-api
  ports:
    - port: 80
      targetPort: 8080
